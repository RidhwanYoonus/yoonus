; Queue worker for price recalculation, notifications and conversions.
; sudo cp deploy/supervisor-queue.conf /etc/supervisor/conf.d/shop-queue.conf && sudo supervisorctl reread && sudo supervisorctl update
[program:shop-queue]
command=php /var/www/shop/artisan queue:work --sleep=1 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/shop-queue.log
