# /etc/nginx/sites-available/shop  (behind Cloudflare; TLS via certbot or Cloudflare origin cert)
server {
    listen 80;
    server_name example.ae www.example.ae;
    return 301 https://example.ae$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.ae;
    root /var/www/shop/public;
    index index.php;

    ssl_certificate     /etc/ssl/shop/fullchain.pem;
    ssl_certificate_key /etc/ssl/shop/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /storage/ { expires 30d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) { deny all; }
}
